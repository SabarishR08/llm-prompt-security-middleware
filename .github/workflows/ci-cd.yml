name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.12'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio
    
    - name: Download spacy model
      run: |
        python -m spacy download en_core_web_sm || echo "Spacy model download skipped"
    
    - name: Run linting
      continue-on-error: true
      run: |
        pip install flake8 black
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        black --check . --diff || true
    
    - name: Run tests with coverage
      env:
        ENVIRONMENT: testing
        GEMINI_API_KEY: test_key
        VIRUSTOTAL_API_KEY: test_key
        GOOGLE_SAFEBROWSING_API_KEY: test_key
      run: |
        pytest tests/test_security_features.py -v --cov=. --cov-report=xml --cov-report=html || pytest tests/test_security_features.py -v
    
    - name: Test Summary
      if: always()
      run: |
        echo "### Test Results :test_tube:" >> $GITHUB_STEP_SUMMARY
        echo "Tests completed. Check logs for details." >> $GITHUB_STEP_SUMMARY
    
    - name: Upload coverage reports
      continue-on-error: true
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Run Trivy vulnerability scanner
      continue-on-error: true
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        exit-code: '0'
    
    - name: Upload Trivy results to GitHub Security
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
    
    - name: Run Bandit security scan
      continue-on-error: true
      run: |
        pip install bandit
        bandit -r . -f json -o bandit-report.json -ll || true
    
    - name: Display Bandit results
      continue-on-error: true
      run: |
        if [ -f bandit-report.json ]; then
          echo "Bandit scan completed"
          cat bandit-report.json | head -50
        fi
    
    - name: Upload security artifacts
      continue-on-error: true
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          trivy-results.sarif
          bandit-report.json

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && needs.test.result == 'success'
    continue-on-error: true
    
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    continue-on-error: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up kubectl
      if: secrets.KUBECONFIG != ''
      uses: azure/setup-kubectl@v3
    
    - name: Configure kubectl
      if: secrets.KUBECONFIG != ''
      run: |
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig.yaml
        echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV
    
    - name: Deploy to Kubernetes
      if: secrets.KUBECONFIG != ''
      run: |
        kubectl apply -f k8s/
        kubectl rollout status deployment/ai-security-app -n ai-security
    
    - name: Verify deployment
      if: secrets.KUBECONFIG != ''
      run: |
        kubectl get pods -n ai-security
        kubectl get services -n ai-security
    
    - name: Run smoke tests
      if: secrets.KUBECONFIG != ''
      run: |
        # Wait for deployment to be ready
        sleep 30
        # Add smoke test commands here
        curl -f https://yourdomain.com/health/live || exit 1
    
    - name: Skip deployment (secrets not configured)
      if: secrets.KUBECONFIG == ''
      run: |
        echo "Skipping deployment - KUBECONFIG secret not configured"
        echo "Please add KUBECONFIG secret to deploy to Kubernetes"

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    
    steps:
    - name: Check pipeline status
      run: |
        echo "Pipeline Status:"
        echo "Build: ${{ needs.build.result }}"
        echo "Deploy: ${{ needs.deploy.result }}"
    
    - name: Send notification
      run: |
        if [ "${{ needs.build.result }}" = "success" ]; then
          echo "✅ Build succeeded"
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ Deployment succeeded"
          elif [ "${{ needs.deploy.result }}" = "skipped" ]; then
            echo "⏭️  Deployment skipped (secrets not configured)"
          else
            echo "❌ Deployment failed"
          fi
        else
          echo "❌ Build failed"
        fi
        # Add Slack/Discord/Email notification here
